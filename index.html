<style>
/* Layout: одна колонка-карточка 640px, один вопрос на экран, тонкий прогресс сверху, навигация снизу */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --fg:#14171A; --ink2:#5A6D7C; --mute:#92A2B0;
  --line:#D0D7DD; --fill:#E9ECEF;
  --accent:#C17DF7; --accent-d:#8B3FD9; --accent-soft:#F4E9FD; --accent-ring:rgba(193,125,247,.35);
  --on-accent:#FFFFFF; --danger:#D42A5B;
  --font:'SB Sans Display',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:12px; --r-s:8px; --dur:.16s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121016; --surface:#1C1922; --fg:#F1EEF5; --ink2:#B3A9C2; --mute:#8A8296;
  --line:#3A3445; --fill:#2A2532;
  --accent:#C17DF7; --accent-d:#A65EEB; --accent-soft:rgba(193,125,247,.14); --accent-ring:rgba(193,125,247,.45);
  --on-accent:#FFFFFF; --danger:#FF6B93; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121016; --surface:#1C1922; --fg:#F1EEF5; --ink2:#B3A9C2; --mute:#8A8296;
  --line:#3A3445; --fill:#2A2532;
  --accent:#C17DF7; --accent-d:#A65EEB; --accent-soft:rgba(193,125,247,.14); --accent-ring:rgba(193,125,247,.45);
  --on-accent:#FFFFFF; --danger:#FF6B93; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;display:flex;flex-direction:column;gap:20px}
@media (max-width:480px){.card{padding:22px 18px 20px}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink2)}
.brand{font-weight:600;letter-spacing:.02em}
.prog{height:4px;background:var(--fill);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s ease}

.eyebrow{font-size:13px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
h1{font-size:30px;line-height:1.15;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:22px;line-height:1.25;font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
.lead{font-size:17px;color:var(--fg)}
.muted{color:var(--ink2)}
.hint{font-size:13px;color:var(--mute)}
.req{color:var(--accent-d);font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--fill);color:var(--ink2)}

/* options */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
  background:var(--surface);transition:border-color var(--dur),background var(--dur);user-select:none;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--mute);border-radius:50%;display:grid;place-items:center;transition:all var(--dur)}
.opt.multi .mk{border-radius:6px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .mk{border-color:var(--accent);background:var(--accent)}
.opt.on .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.opt.multi.on .mk::after{width:10px;height:6px;border-radius:0;background:none;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.opt:focus-within{box-shadow:0 0 0 3px var(--accent-ring)}
.opt .tx{min-width:0}
.sep{height:1px;background:var(--line);margin:4px 0}

textarea,input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;resize:vertical;transition:border-color var(--dur)}
textarea{min-height:84px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--ink2)}

/* segmented grids: matrix / likert / nps */
.grp{display:flex;flex-direction:column;gap:10px}
.grp + .grp{margin-top:14px;padding-top:24px;border-top:1px solid var(--fill)}
.grp-t{font-weight:600;font-size:15px}
.seg{display:grid;gap:6px}
.seg.c5{grid-template-columns:repeat(5,1fr)}
.seg.time{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.seg.nps{grid-template-columns:repeat(11,1fr);gap:5px}
@media (max-width:430px){.seg.nps{grid-template-columns:repeat(6,1fr)}}
.sb{font:inherit;font-size:14px;line-height:1.25;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
  padding:10px 6px;cursor:pointer;min-height:44px;transition:all var(--dur);-webkit-tap-highlight-color:transparent;text-align:center}
.sb:hover{border-color:var(--accent)}
.sb:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-ring)}
.sb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.sb.na{font-size:13px;color:var(--ink2);padding:8px 12px;min-height:36px;justify-self:start}
.sb.na.on{background:var(--fill);border-color:var(--mute);color:var(--fg)}
.scale-l{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--mute)}
.row-na{display:flex}

/* nav */
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:4px}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:999px;padding:12px 22px;cursor:pointer;border:1px solid transparent;transition:all var(--dur);min-height:46px}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-ring)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(.94)}
.btn.pri[disabled]{opacity:.55;cursor:default}
.btn.sec{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.sec:hover{border-color:var(--accent);color:var(--fg)}
.btn.link{background:none;border:0;color:var(--accent-d);padding:8px 0;min-height:0}
.nav .sp{flex:1}
.err{font-size:14px;color:var(--danger)}
.note{font-size:14px;padding:12px 14px;border-radius:var(--r);background:var(--fill);color:var(--ink2)}

/* done */
.done-mark{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.done-mark::after{content:"";width:20px;height:11px;border:3px solid var(--accent-d);border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
(() => {
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbz4l2BANAmGG-J0a7gE2Xk82BP6HWZcp7BdiKqD1vDGgiIGcR-itArQ7pNsiqzcfeQZew/exec';
const DEADLINE = null; // без срока; чтобы закрыть опрос: new Date('2026-11-21T00:00:00+03:00')
const DONE_KEY = 'dpss-kit-survey-done-v1';
const SKIP_TO_9 = ['Пробовал(а), но больше не пользуюсь','Не пользовался(-ась)'];
const OTHER = 'Свой вариант';

const Q = [
  {id:'q1',type:'single',req:true,title:'Как часто вы пользуетесь скиллом?',
   opts:['Несколько раз в неделю','Раз в неделю','Несколько раз в месяц','Реже раза в месяц','Пробовал(а), но больше не пользуюсь','Не пользовался(-ась)'],
   follow:{when:SKIP_TO_9,id:'q1_why',label:'Расскажите, что помешало'}},
  {id:'q2',type:'single',req:true,title:'Сколько презентаций в месяц вы обычно делаете?',
   opts:['1–2','3–5','6–10','Больше 10'],other:true},
  {id:'q3',type:'matrix',req:true,title:'Сколько времени у вас уходит на презентацию примерно из 10 слайдов?',
   rows:['Без скилла (раньше)','Со скиллом (сейчас)'],
   cols:['до 1 часа','до 2 часов','2–4 часа','4–8 часов (около дня)','1–2 дня'],comment:'Комментарий'},
  {id:'q4',type:'multi',shuffle:true,title:'Для каких задач вы используете скилл?',
   opts:['Презентации для руководства','Внутренние встречи и статусы','Отчёты и аналитика','Внешние материалы','Визуализация данных и схем'],
   other:true,exclusive:'Не пользовался(-ась)'},
  {id:'q5',type:'likert',title:'Насколько вы согласны с утверждениями?',
   rows:['Со скиллом презентации получаются качественнее, чем когда я делаю их сам(а) без дизайнера',
         'Документы получаются в едином фирменном стиле',
         'Данные легче читать: графики, таблицы, акценты',
         'Правок и согласований стало меньше',
         'Скилл было легко установить и начать с ним работать'],comment:'Комментарий'},
  {id:'q6',type:'multi',shuffle:true,title:'Как скилл влияет на вашу работу?',
   opts:['Сразу предлагает варианты визуализации, не нужно рисовать от руки','Помогает красиво визуализировать информацию через графики и схемы',
         'Помогает увидеть в данных новые инсайты','Помогает формулировать выводы','Снимает рутину с вёрсткой и оформлением'],
   other:true,exclusive:'Пока не помогает',extra:{id:'q6_example',label:'Если есть пример, опишите его'}},
  {id:'q7',type:'nps',title:'Насколько вероятно, что вы порекомендуете скилл коллеге?',
   extra:{id:'q7_why',label:'Почему такая оценка? Что нравится больше всего?'}},
  {id:'q8',type:'multi',shuffle:true,title:'Что чаще всего приходится исправлять вручную после генерации?',
   opts:['Вёрстку и отступы','Цвета и акценты','Таблицы','Графики и диаграммы','Тексты и формулировки','Экспорт в PPTX / PDF'],
   other:true,exclusive:'Ничего не приходится'},
  {id:'q9',type:'text',title:'Чего не хватает и что бы вы улучшили в первую очередь?'}
];
const TOTAL = Q.length;

const A = {};            // ответы
const order = {};        // перемешанный порядок вариантов, стабилен в рамках визита
let step = -1;           // -1 = вступление, 0..8 = вопросы, 9 = финал
const trail = [];        // история переходов для «Назад»
let err = '';
let sending = false;


const card = document.getElementById('card');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function shuffled(q){
  if(!order[q.id]){
    const a = q.opts.slice();
    if(q.shuffle) for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    order[q.id] = a;
  }
  return order[q.id];
}

/* ---------- render ---------- */
function render(){
  const closed = !!DEADLINE && Date.now() >= DEADLINE.getTime();
  if(step === -1) return renderIntro(closed);
  if(step >= TOTAL) return renderDone();
  const q = Q[step];
  const pct = Math.round(step / TOTAL * 100);
  let body = '';
  if(q.type==='single') body = optsHTML(q,false);
  if(q.type==='multi')  body = optsHTML(q,true);
  if(q.type==='matrix') body = matrixHTML(q);
  if(q.type==='likert') body = likertHTML(q);
  if(q.type==='nps')    body = npsHTML(q);
  if(q.type==='text')   body = `<textarea id="${q.id}" data-t="${q.id}" rows="5" placeholder="Напишите, чего не хватает и/или что требует улучшений">${esc(A[q.id]||'')}</textarea>`;
  const isLast = step === TOTAL-1;
  card.innerHTML = `
    <div class="top"><span class="brand">ДПСС-кит · опрос</span><span>Вопрос ${step+1} из ${TOTAL}</span></div>
    <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <h2>${esc(q.title)}</h2>
      <p class="hint">${hintFor(q)}</p>
    </div>
    ${body}
    ${err?`<p class="err" role="alert">${esc(err)}</p>`:''}
    <div class="nav">
      <button class="btn sec" id="back" type="button">Назад</button>
      <span class="sp"></span>
      <button class="btn pri" id="next" type="button" ${sending?'disabled':''}>${isLast?(sending?'Отправляем…':'Отправить'):'Далее'}</button>
    </div>`;
  bind();
}

function hintFor(q){
  const r = q.req ? '<span class="req">Обязательный вопрос</span> · ' : 'Необязательный вопрос · ';
  if(q.type==='single') return r+'один ответ';
  if(q.type==='multi')  return r+'можно выбрать несколько';
  if(q.type==='matrix') return r+'по одному ответу в каждой строке';
  if(q.type==='likert') return r+'1 — полностью не согласен(-на), 3 — нейтрально, 5 — полностью согласен(-на)';
  if(q.type==='nps')    return r+'0 — точно не порекомендую, 10 — обязательно порекомендую';
  return 'Необязательный вопрос · свободный ответ';
}

function optRow(q,val,multi,checked,label){
  return `<label class="opt ${multi?'multi':''} ${checked?'on':''}">
    <input type="${multi?'checkbox':'radio'}" name="${q.id}" value="${esc(val)}" ${checked?'checked':''}>
    <span class="mk" aria-hidden="true"></span><span class="tx">${esc(label||val)}</span></label>`;
}
function optsHTML(q,multi){
  const sel = multi ? (A[q.id]||[]) : A[q.id];
  const has = v => multi ? sel.includes(v) : sel===v;
  let h = '<div class="opts">';
  for(const o of shuffled(q)) h += optRow(q,o,multi,has(o));
  if(q.other) h += optRow(q,OTHER,multi,has(OTHER),'Свой вариант');
  if(has(OTHER)) h += `<input type="text" id="${q.id}_other" data-t="${q.id}_other" placeholder="Ваш вариант" value="${esc(A[q.id+'_other']||'')}">`;
  if(q.exclusive){ h += '<div class="sep"></div>' + optRow(q,q.exclusive,multi,has(q.exclusive)); }
  h += '</div>';
  if(q.follow && q.follow.when.includes(A[q.id])) h += textField(q.follow.id,q.follow.label);
  if(q.extra) h += textField(q.extra.id,q.extra.label);
  return h;
}
function textField(id,label){
  return `<div class="field"><label for="${id}">${esc(label)}</label><textarea id="${id}" data-t="${id}" rows="3">${esc(A[id]||'')}</textarea></div>`;
}
function matrixHTML(q){
  const v = A[q.id]||{};
  let h = '';
  q.rows.forEach((r,i)=>{
    h += `<div class="grp" role="radiogroup" aria-label="${esc(r)}"><div class="grp-t">${esc(r)}</div><div class="seg time">`;
    q.cols.forEach(c=> h += `<button type="button" class="sb ${v['r'+i]===c?'on':''}" data-m="${q.id}" data-r="r${i}" data-v="${esc(c)}" aria-pressed="${v['r'+i]===c}">${esc(c)}</button>`);
    h += '</div></div>';
  });
  return `<div>${h}</div>` + textField(q.id+'_comment',q.comment);
}
function likertHTML(q){
  const v = A[q.id]||{};
  let h = '';
  q.rows.forEach((r,i)=>{
    const cur = v['r'+i];
    h += `<div class="grp" role="radiogroup" aria-label="${esc(r)}"><div class="grp-t">${esc(r)}</div><div class="seg c5">`;
    for(let n=1;n<=5;n++) h += `<button type="button" class="sb ${cur===n?'on':''}" data-m="${q.id}" data-r="r${i}" data-v="${n}" aria-pressed="${cur===n}">${n}</button>`;
    h += `</div><div class="row-na"><button type="button" class="sb na ${cur==='na'?'on':''}" data-m="${q.id}" data-r="r${i}" data-v="na" aria-pressed="${cur==='na'}">Не могу оценить</button></div></div>`;
  });
  return `<div>${h}</div>` + textField(q.id+'_comment',q.comment);
}
function npsHTML(q){
  const cur = A[q.id];
  let h = '<div class="grp"><div class="seg nps" role="radiogroup" aria-label="Оценка от 0 до 10">';
  for(let n=0;n<=10;n++) h += `<button type="button" class="sb ${cur===n?'on':''}" data-n="${n}" aria-pressed="${cur===n}">${n}</button>`;
  h += '</div><div class="scale-l"><span>0 — точно не порекомендую</span><span>10 — обязательно</span></div></div>';
  return h + textField(q.extra.id,q.extra.label);
}

function bind(){
  const q = Q[step];
  card.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const v = inp.value;
      if(inp.type==='radio'){ A[q.id]=v; }
      else{
        let s = (A[q.id]||[]).slice();
        if(inp.checked){
          if(v===q.exclusive) s=[v]; else { s=s.filter(x=>x!==q.exclusive); s.push(v); }
        } else s=s.filter(x=>x!==v);
        A[q.id]=s;
      }
      err=''; keepFocusRender(`input[name="${q.id}"][value="${CSS.escape(v)}"]`);
    });
  });
  card.querySelectorAll('[data-t]').forEach(t=> t.addEventListener('input',()=>{A[t.dataset.t]=t.value}));
  card.querySelectorAll('[data-m]').forEach(b=> b.addEventListener('click',()=>{
    const o = A[b.dataset.m] = Object.assign({},A[b.dataset.m]);
    const v = b.dataset.v; o[b.dataset.r] = (q.type==='likert' && v!=='na') ? +v : v;
    err=''; keepFocusRender(`[data-m="${b.dataset.m}"][data-r="${b.dataset.r}"][data-v="${CSS.escape(v)}"]`);
  }));
  card.querySelectorAll('[data-n]').forEach(b=> b.addEventListener('click',()=>{
    A[q.id] = +b.dataset.n; err=''; keepFocusRender(`[data-n="${b.dataset.n}"]`);
  }));
  document.getElementById('back').onclick = back;
  document.getElementById('next').onclick = next;
}
function keepFocusRender(sel){
  const y = window.scrollY; render(); window.scrollTo(0,y);
  const el = card.querySelector(sel); if(el) el.focus({preventScroll:true});
}

/* ---------- navigation ---------- */
function validate(q){
  if(q.type==='single'){
    if(q.req && !A[q.id]) return 'Выберите один вариант, чтобы продолжить';
    if(A[q.id]===OTHER && !(A[q.id+'_other']||'').trim()) return 'Напишите свой вариант';
  }
  if(q.type==='multi'){
    if((A[q.id]||[]).includes(OTHER) && !(A[q.id+'_other']||'').trim()) return 'Напишите свой вариант или снимите галочку';
  }
  if(q.type==='matrix' && q.req){
    const v=A[q.id]||{}; if(q.rows.some((_,i)=>!v['r'+i])) return 'Ответьте для обеих строк: без скилла и со скиллом';
  }
  return '';
}
function next(){
  if(sending) return;
  const q = Q[step];
  err = validate(q);
  if(err) return render();
  if(step === TOTAL-1) return submit();
  trail.push(step);
  step = (q.id==='q1' && SKIP_TO_9.includes(A.q1)) ? TOTAL-1 : step+1;
  render(); window.scrollTo(0,0);
}
function back(){
  err='';
  step = trail.length ? trail.pop() : -1;
  render(); window.scrollTo(0,0);
}

/* ---------- submit ---------- */
function clean(){
  const out = {};
  const skipped = SKIP_TO_9.includes(A.q1);
  for(const q of Q){
    if(skipped && !['q1','q9'].includes(q.id)) continue;
    const keys = [q.id, q.id+'_other', q.id+'_comment', q.follow&&q.follow.id, q.extra&&q.extra.id].filter(Boolean);
    for(const k of keys){
      let v = A[k];
      if(v===undefined || v==='' || (Array.isArray(v)&&!v.length)) continue;
      if(typeof v==='string') v = v.trim().slice(0,4000);
      if(k===q.id+'_other' && !((A[q.id]===OTHER)||(Array.isArray(A[q.id])&&A[q.id].includes(OTHER)))) continue;
      if(q.follow && k===q.follow.id && !q.follow.when.includes(A.q1)) continue;
      if(v!=='') out[k]=v;
    }
  }
  return out;
}
// Плоская строка для таблицы: [заголовок столбца, значение]
function rowPairs(a){
  const p = [['Дата', new Date().toISOString().slice(0,10)], ['Ветка', SKIP_TO_9.includes(A.q1)?'не пользуются':'пользуются']];
  for(const q of Q){
    const n = Q.indexOf(q)+1;
    if(q.type==='matrix'||q.type==='likert') q.rows.forEach((r,i)=>p.push([n+'. '+r, a[q.id]&&a[q.id]['r'+i]!==undefined ? (a[q.id]['r'+i]==='na'?'Не могу оценить':a[q.id]['r'+i]) : '']));
    else p.push([n+'. '+q.title, Array.isArray(a[q.id]) ? a[q.id].join(' | ') : (a[q.id]!==undefined?a[q.id]:'')]);
    if(q.other) p.push([n+'. Свой вариант', a[q.id+'_other']||'']);
    if(q.comment) p.push([n+'. Комментарий', a[q.id+'_comment']||'']);
    if(q.follow) p.push([n+'. '+q.follow.label, a[q.follow.id]||'']);
    if(q.extra) p.push([n+'. '+q.extra.label, a[q.extra.id]||'']);
  }
  return p;
}
async function post(body){
  try{
    const r = await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'server');
  }catch(e){
    if(e instanceof TypeError){ // браузер не дал прочитать ответ Google — отправляем без чтения ответа
      await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    } else throw e;
  }
}
async function submit(){
  if(ENDPOINT.includes('ВСТАВЬТЕ')){ err='Опрос ещё не подключён к таблице.'; return render(); }
  sending = true; err=''; render();
  try{ await post(JSON.stringify({row: rowPairs(clean())})); }
  catch(e){ sending=false; err='Ответ не отправился — похоже, пропала связь. Ответы на месте, нажмите «Отправить» ещё раз.'; return render(); }
  sending=false; ls.set(DONE_KEY,'1'); trail.length=0; step=TOTAL; render(); window.scrollTo(0,0);
}

/* ---------- intro / done ---------- */
function renderIntro(closed){
  const already = ls.get(DONE_KEY)==='1';
  card.innerHTML = `
    <div class="top"><span class="brand">ДПСС-кит · опрос</span><span>3 минуты</span></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <h1>Привет!</h1>
      <p class="lead">Некоторое время назад мы поделились ДПСС-китом — шаблоном и дизайн-системой для презентаций через Claude. Хотим честно понять, насколько он помогает в работе и что в нём улучшить.</p>
      <p class="muted">По итогам доработаем скилл и расскажем, что изменилось.</p>
    </div>
    <div class="facts"><span class="chip">Анонимно</span><span class="chip">9 вопросов · около 3 минут</span></div>
    ${closed ? '<p class="note">Опрос завершён. Спасибо всем, кто ответил!</p>'
      : already ? '<p class="note">Вы уже прошли опрос с этого устройства — спасибо! Если хотите дополнить ответ, можно заполнить его ещё раз.</p>' : ''}
    ${closed?'':`<div class="nav"><span class="sp"></span><button class="btn pri" id="start" type="button">${already?'Заполнить ещё раз':'Начать'}</button></div>`}`;
  const s = document.getElementById('start'); if(s) s.onclick = ()=>{ step=0; render(); window.scrollTo(0,0); };
}
function renderDone(){
  card.innerHTML = `
    <div class="done-mark" aria-hidden="true"></div>
    <h1>Спасибо!</h1>
    <p class="lead">Учтём ваши ответы в следующей версии скилла.</p>`;
}

/* ---------- boot ---------- */
render();
})();
</script>

</body>
</html>
